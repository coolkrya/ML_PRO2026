name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: predictions}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/predictions


    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
  
  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses:  docker/setup-buildx-action@v4
      - uses:  docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max
  
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: read}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - uses: helm/kind-action@v1
        with: {cluster_name: ci}

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ci

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/predictions"
      
      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s
      
      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/price-predicting api="$IMAGE"
          kubectl rollout status deploy/price-predicting --timeout=120s
          sleep 10
          kubectl exec deploy/postgres -- psql -U postgres -d predictions \
              -tc "SELECT 1 FROM predictions"

      - name: smoke
        run: |
          kubectl port-forward svc/price-predicting-service 8080:80 &
          sleep 5

          curl --fail -s localhost:8080/health; echo
          curl ‐‐fail ‐s ‐X POST localhost:8080/v1/predict \
            ‐H "Content‐Type: application/json" ‐d @good.json \
          | python3 ‐c "import json,sys; r=json.load(sys.stdin); assert 0 <= r['predicted_price'], r"
      
      - name: диагностика
        if: failure()

        run: |
          kubectl get pods -o wide
          kubectl describe deploy/price-predicting | tail -20
          kubectl logs deploy/price-predicting --tail=30 || true
