name: ci

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch: 

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: predictions}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/predictions
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, kind]
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: docker/setup-buildx-action@v4
      
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    env:
      KIND_CLUSTER: sem3

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: kind, kubectl и доступ к кластеру
        run: |
          B=~/.local/bin && mkdir -p $B && echo "$B" >> "$GITHUB_PATH"
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            KIND_ARCH="arm64"
            K8S_ARCH="arm64"
          else
            KIND_ARCH="amd64"
            K8S_ARCH="amd64"
          fi
          
          [ -x $B/kind ] || curl -sSLo $B/kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-${KIND_ARCH}"
          [ -x $B/kubectl ] || curl -sSLo $B/kubectl "https://dl.k8s.io/v1.31.0/bin/linux/${K8S_ARCH}/kubectl"
          
          chmod +x $B/kind $B/kubectl
          s
          $B/kind export kubeconfig --name "${KIND_CLUSTER:-sem3}" --internal
          $B/kubectl get nodes

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/predictions" \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: Debug secret length
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error:: DB_PASSWORD empty"
            exit 1
          else
            echo "ok"
          fi

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/price-predicting api="$IMAGE"
          kubectl rollout status deploy/price-predicting --timeout=180s

      - name: smoke
        run: |
          U="http://$KIND_CLUSTER-control-plane:30080"
          H="Host: price.localhost"

          curl --fail -s --retry 5 --retry-all-errors -H "$H" $U/health | tee health.json; echo
          grep -q '"model_version":"price-v"' health.json
          
          curl --fail -s -X POST -H "$H" $U/v1/predict \
            -H "Content-Type: application/json" -d @good.json | tee pred.json; echo

          sleep 2

          RID=$(jq -r .request_id pred.json)
          kubectl exec deploy/postgres -- psql -U postgres -d predictions \
            -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'" | grep -qx 1

      - name: диагностика
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get ingress -A
          kubectl describe deploy/price-predicting | tail -20
          kubectl logs deploy/price-predicting --tail=50 || true
